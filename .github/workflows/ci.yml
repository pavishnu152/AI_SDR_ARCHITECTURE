# CI pipeline: lints and tests the code on every push/PR, then — on a
# runner that actually has Docker (this project's dev sandbox didn't) —
# builds the real Dockerfile + docker-compose stack and hits the live
# /health endpoint. That second job is the first *real* proof the Docker
# setup from Milestone 11 works, not just a static file review.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python),
        # 3.11 is what the Docker image ships. Testing both catches
        # version-specific bugs before they reach either surface. Not
        # testing 3.12+ yet — not verified against this dependency set.
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests with coverage
        # Coverage floor is 85, not the ~97% measured locally — a CI gate
        # should fail on real regressions, not on every small, deliberate
        # trade-off (like the orchestrator_legacy.py omit). Leaves headroom
        # instead of becoming a build that's always one refactor away from
        # a red pipeline for no functional reason.
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    name: Build & smoke-test Docker stack
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for the stack
        # Placeholder values only. /health doesn't touch the LLM or need
        # real secrets — this just satisfies docker-compose's env_file
        # requirement (a missing env_file is a hard error, not a no-op).
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose -f docker/docker-compose.yml up --build -d

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
