# Synthetic evaluation dataset for the Scoring Agent.
#
# Why synthetic (fictional) companies instead of real ones scraped live:
# 1. Determinism/reproducibility — a real company's funding/hiring/marketing
#    pages change over time, so an eval built on live-scraped data would
#    silently drift: the same eval script could report a different pass
#    rate next month with no code change. A versioned, fixed fixture file
#    stays stable, which is what makes it useful for regression testing
#    ("did my last prompt change make scoring worse?").
# 2. Isolation — this eval measures the Scoring Agent specifically (does it
#    correctly weigh a GIVEN set of signals against the ICP rubric), not
#    the Research Agent's ability to find real signals on the live web.
#    Conflating the two would make a failure ambiguous: is scoring wrong,
#    or did research just find less this time?
# 3. No risk of asserting inaccurate facts about real companies.
#
# expected_band is the ground-truth label a human would assign, one of:
# reject / review / ready — matching configs/icp_ai_native_b2b.yaml's
# score_thresholds. The eval harness (src/eval/run_eval.py) runs each
# entry's `research` through the real Scoring Agent and checks whether the
# resulting score falls in the same band.

