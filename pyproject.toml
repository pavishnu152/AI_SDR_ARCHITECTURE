[project]
name = "ai-sdr-agent"
version = "0.1.0"
description = "Multi-agent AI SDR: researches, scores, and drafts outreach to AI-native B2B leads, with full decision traceability."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "openai>=1.50",
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Pinned below 4.1: passlib 1.7.4 (last released 2020, no newer version
    # exists) reads bcrypt.__about__.__version__ and runs an internal
    # self-test (detect_wrap_bug) that both break against bcrypt>=4.1's
    # changed internals — passlib[bcrypt]'s own unpinned ">=3.1.0" constraint
    # lets pip resolve the newest bcrypt (5.x) by default, which is what
    # actually crashed registration with a misleading "password cannot be
    # longer than 72 bytes" error that had nothing to do with the password
    # entered. bcrypt 4.0.1 is the last release passlib 1.7.4 fully supports.
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "email-validator>=2.0",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# An unconfigured ruff (no explicit select) turns out to enable its full
# rule catalogue, not a small sane default — found this by actually running
# it before wiring it into CI, rather than trusting the "it'll just work"
# assumption. E/F/I/UP/B is a standard, curated production selection:
# pycodestyle errors, pyflakes, isort, pyupgrade, and bugbear (real-bug
# detection, e.g. mutable default args).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency-injection pattern *is* `Depends(...)` as an
    # argument default — that's the framework's documented API, not a bug.
    # Ignoring B008 project-wide is standard practice in FastAPI codebases.
    "B008",
    # line-length=100 above still caps generated/auto-fixed code, but E501
    # itself is off: it fires on things a line-wrap would make worse, not
    # better — the ASCII pipeline diagram in orchestrator.py's docstring,
    # a couple of descriptive inline comments, one dict comprehension.
    # Ruff's own default rule set excludes E501 for the same reason; this
    # makes that same call explicit instead of relying on it being unstated.
    "E501",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
# orchestrator_legacy.py is a deliberately frozen historical reference
# (see its module docstring) — it's not called by any live code path, so
# it's excluded from coverage targets rather than chased for tests that
# would just re-verify Milestone 6 code a second time for no reason.
omit = ["src/agents/orchestrator_legacy.py"]